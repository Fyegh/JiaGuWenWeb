<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的收藏 | 象形文创</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    .fav-page { padding: 140px 40px 80px; max-width: 1400px; margin: 0 auto; min-height: 70vh; }
    .fav-header { margin-bottom: 40px; }
    .fav-header h1 { font-family: var(--font-serif); font-size: 2rem; margin-bottom: 8px; }
    .fav-header p { color: var(--text-muted); font-size: 0.9rem; }
    .fav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .fav-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .fav-card:hover {
      transform: translateY(-8px);
      border-color: var(--gold);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3), 0 0 30px rgba(212,175,55,0.05);
    }
    .fav-card-img {
      width: 100%; height: 280px;
      background: linear-gradient(135deg, #0a0908, #141210);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; cursor: pointer;
    }
    .fav-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s; }
    .fav-card:hover .fav-card-img img { transform: scale(1.08); }
    .fav-card-img .fav-ph {
      font-family: var(--font-serif); font-size: 5rem;
      color: rgba(212,175,55,0.08); transition: all 0.8s;
    }
    .fav-card:hover .fav-card-img .fav-ph {
      color: rgba(212,175,55,0.18); transform: scale(1.15) rotate(5deg);
    }
    .fav-card-body { padding: 20px; }
    .fav-card-cat { font-size: 0.72rem; color: var(--gold); letter-spacing: 3px; margin-bottom: 8px; }
    .fav-card-name {
      font-family: var(--font-serif); font-size: 1rem; font-weight: 600;
      margin-bottom: 12px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .fav-card-bottom { display: flex; justify-content: space-between; align-items: center; }
    .fav-card-price { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 700; color: var(--gold); }
    .fav-card-actions { display: flex; gap: 8px; }
    .fav-card-actions button {
      padding: 8px 14px; border-radius: 6px; font-size: 0.78rem;
      cursor: pointer; transition: all 0.3s; border: 1px solid var(--border-color);
      background: transparent; color: var(--text-secondary);
    }
    .fav-card-actions button:hover { border-color: var(--gold); color: var(--gold); }
    .fav-card-actions .btn-remove:hover { border-color: #e74c3c; color: #e74c3c; }
    .fav-empty {
      text-align: center; padding: 100px 20px; grid-column: 1/-1;
    }
    .fav-empty .icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.3; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-logo"><span class="logo-icon">甲</span><span>象形文创</span></a>
    <ul class="nav-links">
      <li><a href="/">首页</a></li>
      <li><a href="/products.html">全部产品</a></li>
      <li><a href="/oracle.html">甲骨文字馆</a></li>
      <li><a href="/history.html">千年之旅</a></li>
      <li><a href="/favorites.html" class="active">收藏</a></li>
      <li><a href="/cart.html">购物车</a></li>
    </ul>
    <div class="nav-actions" id="navActions">
      <a href="/login.html" class="btn btn-ghost btn-sm">登录</a>
    </div>
  </nav>

  <main class="fav-page">
    <div class="fav-header animate-on-scroll">
      <h1>我的 <span class="gold-text">收藏</span></h1>
      <p>在这里找到你心仪的文创珍品</p>
    </div>
    <div class="fav-grid" id="favGrid">
      <div style="grid-column:1/-1; text-align:center; padding:80px;">
        <div style="font-size:2rem; opacity:0.3;">⏳</div>
        <div style="color:var(--text-muted); margin-top:12px;">加载中...</div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-main">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <span>© 2024 象形文创 · 传承华夏文明</span>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/animations.js"></script>
  <script>
    const oracleChars = ['龍','鳳','禾','鼎','壽','福','祿','喜','文','墨'];

    async function loadFavorites() {
      const grid = document.getElementById('favGrid');
      const token = localStorage.getItem('token');
      
      if (!token) {
        grid.innerHTML = `
          <div class="fav-empty">
            <div class="icon">🔒</div>
            <h3 style="font-family:var(--font-serif); margin-bottom:12px;">请先登录</h3>
            <p style="color:var(--text-muted); margin-bottom:20px;">登录后即可查看你的收藏</p>
            <a href="/login.html" class="btn btn-primary">去登录</a>
          </div>`;
        return;
      }

      try {
        const data = await API.getFavorites();
        const favs = data.favorites || [];

        if (favs.length === 0) {
          grid.innerHTML = `
            <div class="fav-empty">
              <div class="icon">♡</div>
              <h3 style="font-family:var(--font-serif); margin-bottom:12px;">收藏夹是空的</h3>
              <p style="color:var(--text-muted); margin-bottom:20px;">去发现更多精美文创产品吧</p>
              <a href="/products.html" class="btn btn-primary">浏览产品</a>
            </div>`;
          return;
        }

        grid.innerHTML = favs.map(item => {
          // ★ 关键：使用 product_id 而不是 fav_id
          const pid = item.product_id || item.id;
          const ph = oracleChars[pid % oracleChars.length];

          let imgHtml = '';
          if (item.image && item.image.trim() !== '') {
            imgHtml = `<img src="${item.image}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                       <div class="fav-ph" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;">${ph}</div>`;
          } else {
            imgHtml = `<div class="fav-ph">${ph}</div>`;
          }

          return `
            <div class="fav-card animate-on-scroll">
              <div class="fav-card-img" onclick="window.location.href='/product-detail.html?id=${pid}'">
                ${imgHtml}
              </div>
              <div class="fav-card-body">
                <div class="fav-card-cat">${item.category || '未分类'}</div>
                <div class="fav-card-name">${item.name}</div>
                <div class="fav-card-bottom">
                  <div class="fav-card-price">¥${item.price}</div>
                  <div class="fav-card-actions">
                    <button onclick="addToCartFromFav(${pid})">🛒 购买</button>
                    <button class="btn-remove" onclick="removeFav(${pid}, this)">取消收藏</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        setTimeout(() => { if (window.animEngine) window.animEngine.observeNewElements(); }, 100);
      } catch (e) {
        console.error('加载收藏失败:', e);
        grid.innerHTML = `
          <div class="fav-empty">
            <div class="icon">⚠️</div>
            <h3 style="font-family:var(--font-serif); margin-bottom:12px;">加载失败</h3>
            <p style="color:var(--text-muted);">${e.message}</p>
            <button class="btn btn-primary" onclick="loadFavorites()" style="margin-top:20px;">重试</button>
          </div>`;
      }
    }

    async function addToCartFromFav(pid) {
      try {
        await API.addToCart(pid, 1);
        showToast('已加入购物车 🛒', 'success');
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function removeFav(pid, btn) {
      try {
        await API.removeFavorite(pid);
        const card = btn.closest('.fav-card');
        card.style.transform = 'scale(0.8)';
        card.style.opacity = '0';
        setTimeout(() => { card.remove(); }, 300);
        showToast('已取消收藏', 'info');
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadFavorites);
  </script>
</body>
</html>
