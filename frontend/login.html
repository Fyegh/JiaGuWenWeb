<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | 象形文创</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030303;
      position: relative;
      overflow: hidden;
    }

    /* 背景装饰 */
    .login-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .login-bg .bg-char {
      position: absolute;
      font-family: 'Noto Serif SC', serif;
      color: rgba(212,175,55,0.02);
      user-select: none;
    }
    .login-bg .bg-char:nth-child(1) { font-size: 20rem; top: -5%; left: -8%; transform: rotate(-15deg); }
    .login-bg .bg-char:nth-child(2) { font-size: 16rem; bottom: -10%; right: -5%; transform: rotate(12deg); }
    .login-bg .bg-char:nth-child(3) { font-size: 12rem; top: 20%; right: 15%; transform: rotate(-8deg); }
    .login-bg .glow1 {
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.04) 0%, transparent 70%);
      top: -10%; left: -10%;
    }
    .login-bg .glow2 {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.03) 0%, transparent 70%);
      bottom: -15%; right: -10%;
    }
    .login-bg .grid-lines {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(212,175,55,0.015) 1px, transparent 1px),
                         linear-gradient(90deg, rgba(212,175,55,0.015) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    /* 登录卡片 */
    .login-container {
      position: relative; z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 0 20px;
    }

    .login-card {
      background: rgba(10,10,10,0.8);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(212,175,55,0.1);
      border-radius: 20px;
      padding: 50px 40px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4), inset 0 1px 0 rgba(212,175,55,0.05);
      animation: cardIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo-icon {
      width: 56px; height: 56px;
      border: 1.5px solid rgba(212,175,55,0.4);
      border-radius: 14px;
      display: inline-flex;
      align-items: center; justify-content: center;
      font-family: 'Noto Serif SC', serif;
      font-size: 1.5rem;
      color: #d4af37;
      margin-bottom: 20px;
      transition: all 0.4s;
      background: rgba(212,175,55,0.03);
    }

    .login-logo-icon:hover {
      background: #d4af37;
      color: #000;
      transform: rotate(-5deg) scale(1.08);
    }

    .login-logo h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f0ece4;
    }

    .login-logo p {
      font-size: 0.88rem;
      color: #5a5550;
    }

    /* 表单 */
    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #a09888;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212,175,55,0.1);
      border-radius: 10px;
      color: #f0ece4;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
    }

    .form-input::placeholder { color: #3a3835; }

    .form-input:focus {
      border-color: rgba(212,175,55,0.4);
      background: rgba(212,175,55,0.03);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.05), 0 4px 20px rgba(0,0,0,0.2);
    }

    .form-input:hover { border-color: rgba(212,175,55,0.2); }

    .pwd-toggle {
      position: absolute;
      right: 14px; top: 38px;
      background: none; border: none;
      color: #5a5550; font-size: 1rem;
      cursor: pointer; padding: 4px;
      transition: color 0.3s;
    }
    .pwd-toggle:hover { color: #d4af37; }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: #d4af37;
      border: none;
      border-radius: 10px;
      color: #000;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(212,175,55,0.35);
    }

    .login-btn:hover::before { left: 100%; }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.5; cursor: not-allowed; transform: none;
    }

    .login-btn .btn-loading {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
      color: #3a3835;
      font-size: 0.75rem;
      letter-spacing: 2px;
    }

    .login-divider::before, .login-divider::after {
      content: '';
      flex: 1; height: 1px;
      background: rgba(212,175,55,0.06);
    }

    .login-footer {
      text-align: center;
      font-size: 0.85rem;
      color: #5a5550;
    }

    .login-footer a {
      color: #d4af37;
      font-weight: 500;
      transition: all 0.3s;
      text-decoration: none;
    }

    .login-footer a:hover {
      color: #e8c84a;
      text-shadow: 0 0 12px rgba(212,175,55,0.3);
    }

    .login-error {
      padding: 12px 16px;
      background: rgba(231,76,60,0.08);
      border: 1px solid rgba(231,76,60,0.2);
      border-radius: 8px;
      color: #e74c3c;
      font-size: 0.82rem;
      margin-bottom: 18px;
      display: none;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .back-home {
      position: fixed;
      top: 30px; left: 30px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #5a5550;
      font-size: 0.82rem;
      text-decoration: none;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .back-home:hover { color: #d4af37; }

    .back-home .arrow {
      display: inline-flex;
      width: 28px; height: 28px;
      align-items: center; justify-content: center;
      border: 1px solid rgba(212,175,55,0.15);
      border-radius: 50%;
      font-size: 0.7rem;
      transition: all 0.3s;
    }

    .back-home:hover .arrow {
      border-color: #d4af37;
      background: rgba(212,175,55,0.06);
    }

    @media (max-width: 480px) {
      .login-card { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <!-- 背景 -->
  <div class="login-bg">
    <div class="grid-lines"></div>
    <div class="glow1"></div>
    <div class="glow2"></div>
    <div class="bg-char">文</div>
    <div class="bg-char">創</div>
    <div class="bg-char">道</div>
  </div>

  <a href="/" class="back-home">
    <span class="arrow">←</span>
    <span>返回首页</span>
  </a>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">甲</div>
        <h1>欢迎回来</h1>
        <p>登录你的象形文创账户</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">用户名 / 邮箱</label>
          <input type="text" class="form-input" id="username" placeholder="请输入用户名或邮箱" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="password" placeholder="请输入密码" required autocomplete="current-password" style="padding-right:44px;">
          <button type="button" class="pwd-toggle" onclick="togglePwd()">👁</button>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span id="btnText">登 录</span>
          <div class="btn-loading" id="btnLoading"></div>
        </button>
      </form>

      <div class="login-divider">或</div>

      <div class="login-footer">
        还没有账户？<a href="/register.html">立即注册</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function togglePwd() {
      const inp = document.getElementById('password');
      const btn = inp.nextElementSibling;
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = '🔒';
      } else {
        inp.type = 'password';
        btn.textContent = '👁';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnLoading = document.getElementById('btnLoading');
      const errBox = document.getElementById('loginError');

      if (!username || !password) {
        errBox.textContent = '请填写用户名和密码';
        errBox.style.display = 'block';
        return;
      }

      errBox.style.display = 'none';
      btn.disabled = true;
      btnText.style.display = 'none';
      btnLoading.style.display = 'inline-block';

      try {
        const data = await API.login(username, password);
        
        // ★ 使用 Auth.setAuth 保存登录状态
        Auth.setAuth(data.token, data.user);
        
        showToast('登录成功！欢迎回来 ' + data.user.username, 'success');

        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/';
          }
        }, 800);

      } catch (err) {
        errBox.textContent = err.message || '登录失败，请检查用户名和密码';
        errBox.style.display = 'block';
        btn.disabled = false;
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';

        // 输入框抖动
        document.querySelectorAll('.form-input').forEach(inp => {
          inp.style.animation = 'shake 0.4s ease';
          setTimeout(() => inp.style.animation = '', 400);
        });
      }
    }

    // 如果已登录则跳转
    if (Auth.isLoggedIn()) {
      window.location.href = '/';
    }
  </script>

  <style>
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</body>
</html>
