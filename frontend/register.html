<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 | 象形文创</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #030303; position: relative; overflow: hidden;
    }
    .login-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .login-bg .bg-char { position: absolute; font-family: 'Noto Serif SC', serif; color: rgba(212,175,55,0.02); user-select: none; }
    .login-bg .bg-char:nth-child(1) { font-size: 18rem; top: -5%; right: -5%; transform: rotate(10deg); }
    .login-bg .bg-char:nth-child(2) { font-size: 14rem; bottom: -8%; left: -3%; transform: rotate(-12deg); }
    .login-bg .glow1 { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(212,175,55,0.04) 0%, transparent 70%); top: -10%; right: -5%; }
    .login-bg .grid-lines { position: absolute; inset: 0; background-image: linear-gradient(rgba(212,175,55,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(212,175,55,0.015) 1px, transparent 1px); background-size: 80px 80px; }

    .login-container { position: relative; z-index: 10; width: 100%; max-width: 440px; padding: 0 20px; }
    .login-card {
      background: rgba(10,10,10,0.8); backdrop-filter: blur(30px);
      border: 1px solid rgba(212,175,55,0.1); border-radius: 20px; padding: 50px 40px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4); animation: cardIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes cardIn { from { opacity:0; transform:translateY(30px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }

    .login-logo { text-align: center; margin-bottom: 36px; }
    .login-logo-icon { width:56px;height:56px;border:1.5px solid rgba(212,175,55,0.4);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-size:1.5rem;color:#d4af37;margin-bottom:20px;background:rgba(212,175,55,0.03); }
    .login-logo h1 { font-family: 'Noto Serif SC', serif; font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; color: #f0ece4; }
    .login-logo p { font-size: 0.88rem; color: #5a5550; }

    .form-group { margin-bottom: 20px; }
    .form-label { display:block;font-size:0.78rem;font-weight:500;color:#a09888;margin-bottom:8px;letter-spacing:1px; }
    .form-input {
      width:100%;padding:14px 18px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,175,55,0.1);
      border-radius:10px;color:#f0ece4;font-size:0.92rem;outline:none;transition:all 0.3s;
    }
    .form-input::placeholder { color:#3a3835; }
    .form-input:focus { border-color:rgba(212,175,55,0.4);background:rgba(212,175,55,0.03);box-shadow:0 0 0 3px rgba(212,175,55,0.05); }

    .login-btn {
      width:100%;padding:15px;background:#d4af37;border:none;border-radius:10px;color:#000;
      font-size:0.95rem;font-weight:600;cursor:pointer;letter-spacing:2px;transition:all 0.4s;margin-top:8px;
    }
    .login-btn:hover { transform:translateY(-2px);box-shadow:0 8px 30px rgba(212,175,55,0.35); }
    .login-btn:disabled { opacity:0.5;cursor:not-allowed;transform:none; }

    .login-divider { display:flex;align-items:center;gap:16px;margin:28px 0;color:#3a3835;font-size:0.75rem;letter-spacing:2px; }
    .login-divider::before,.login-divider::after { content:'';flex:1;height:1px;background:rgba(212,175,55,0.06); }

    .login-footer { text-align:center;font-size:0.85rem;color:#5a5550; }
    .login-footer a { color:#d4af37;font-weight:500;text-decoration:none;transition:color 0.3s; }
    .login-footer a:hover { color:#e8c84a; }

    .login-error { padding:12px 16px;background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.2);border-radius:8px;color:#e74c3c;font-size:0.82rem;margin-bottom:18px;display:none; }

    .back-home { position:fixed;top:30px;left:30px;z-index:100;display:flex;align-items:center;gap:8px;color:#5a5550;font-size:0.82rem;text-decoration:none;transition:color 0.3s; }
    .back-home:hover { color:#d4af37; }
    .back-home .arrow { display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border:1px solid rgba(212,175,55,0.15);border-radius:50%;font-size:0.7rem;transition:all 0.3s; }
    .back-home:hover .arrow { border-color:#d4af37;background:rgba(212,175,55,0.06); }
  </style>
</head>
<body>
  <div class="login-bg">
    <div class="grid-lines"></div>
    <div class="glow1"></div>
    <div class="bg-char">創</div>
    <div class="bg-char">雅</div>
  </div>

  <a href="/" class="back-home"><span class="arrow">←</span><span>返回首页</span></a>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">甲</div>
        <h1>创建账户</h1>
        <p>开启你的象形文创之旅</p>
      </div>

      <div class="login-error" id="regError"></div>

      <form id="regForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input type="email" class="form-input" id="email" placeholder="请输入邮箱地址" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="password" placeholder="至少6位密码" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" class="form-input" id="password2" placeholder="再次输入密码" required>
        </div>
        <button type="submit" class="login-btn" id="regBtn">注 册</button>
      </form>

      <div class="login-divider">或</div>
      <div class="login-footer">已有账户？<a href="/login.html">立即登录</a></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const errBox = document.getElementById('regError');
      const btn = document.getElementById('regBtn');

      if (password !== password2) {
        errBox.textContent = '两次密码不一致'; errBox.style.display = 'block'; return;
      }

      errBox.style.display = 'none';
      btn.disabled = true; btn.textContent = '注册中…';

      try {
        const data = await API.register(username, email, password);
        Auth.setAuth(data.token, data.user);
        showToast('注册成功！', 'success');
        setTimeout(() => window.location.href = '/', 800);
      } catch (err) {
        errBox.textContent = err.message || '注册失败';
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = '注 册';
      }
    }

    if (Auth.isLoggedIn()) window.location.href = '/';
  </script>
</body>
</html>
